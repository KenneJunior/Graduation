<!DOCTYPE html>
<html>
<head>
    <title>SVG to Icon Converter</title>
    <style>
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .preview { margin: 20px 0; border: 1px solid #ccc; padding: 10px; }
        .downloads { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0; }
        .download-item { text-align: center; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007cba; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #005a87; }
        .icon-preview { width: 64px; height: 64px; margin: 0 auto 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SVG to PWA Icon Converter</h1>
        
        <!-- Your SVG -->
        <div id="svg-container">
<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.0004 0 512.0004 512" width="512px" height="512px" xmlns:bx="https://boxy-svg.com">
  <defs>
    <radialGradient id="studio_light" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft_drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-opacity="0.45"/>
    </filter>
    <filter id="drop-shadow-filter-0" bx:preset="drop-shadow 1 10 10 3 0.35 rgba(0,0,0,0.3)" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="10" dy="10"/>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feFlood flood-color="rgba(0,0,0,0.3)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient gradientUnits="userSpaceOnUse" cx="418" cy="278" r="0" id="gradient-0" gradientTransform="matrix(1, 0, 0, 1, 0, 0)">
      <stop offset="0" style="stop-color: rgb(0% 0% 0%)"/>
      <stop offset="1" style=""/>
    </radialGradient>
    <linearGradient gradientUnits="userSpaceOnUse" x1="418" y1="238" x2="418" y2="318" id="gradient-2" gradientTransform="matrix(1.000002, 0, 0, 1, -0.000932, 0)">
      <stop offset="0" style="stop-color: rgb(47.059% 20.784% 5.8824%)"/>
      <stop offset="1" style="stop-color: rgb(33.342% 9.9086% 0%)"/>
    </linearGradient>
    <filter id="drop-shadow-filter-1" bx:preset="drop-shadow 1 12 9 3 0.5 rgba(0,0,0,0.3)" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="12" dy="9"/>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="1"/>
      </feComponentTransfer>
      <feFlood flood-color="rgba(0,0,0,0.3)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="gold_premium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset="0.25" stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#EAB308"/>
      <stop offset="0.7" stop-color="#A16207"/>
      <stop offset="1" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="soft_glint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="white" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.04"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="142" style="fill-rule: nonzero; paint-order: stroke;" fill="url(#studio_light)" ry="142" transform="matrix(1, 0, 0, 1, 2.842170943040401e-14, 0)"/>
  <rect width="512" height="512" rx="142" filter="url(#grain)" opacity="0.15" style="" ry="142" transform="matrix(1, 0, 0, 1, 2.842170943040401e-14, 0)"/>
  <rect x="35.482" y="36.942" width="441.035" height="438.116" rx="220" fill="none" stroke="white" stroke-opacity="0.08" style="stroke-width: 6px;" ry="220" transform="matrix(1, 0, 0, 1, 2.842170943040401e-14, 0)"/>
  <g style="filter: url(&quot;#soft_drop&quot;) url(&quot;#drop-shadow-filter-0&quot;);" transform="matrix(0.8654378652572632, 0, 0, 1, 42.775524139404325, -14.804819107055664)">
    <path d="M150 275V340C150 340 198 390 256 390C314 390 362 340 362 340V275" fill="#020617"/>
    <path d="M460 228L256 330L52 228V240L256 340L460 240V228Z" fill="#020617"/>
    <path d="M256 120L460 228L256 330L52 228L256 120Z" fill="#0F172A"/>
    <path d="M256 120L460 228L256 260Z" opacity="0.045" fill="white"/>
    <ellipse cx="256" cy="228" rx="11" ry="5.5" fill="#020617"/>
    <path d="M256 228C256 228 370 232 418 238" stroke="#020617" stroke-width="3" fill="none"/>
    <path d="M 418.04 237.062 L 415.985 317.626" stroke-linecap="round" style="fill: url(&quot;#gradient-0&quot;); stroke: url(&quot;#gradient-2&quot;); stroke-width: 1.072;"/>
    <g transform="translate(398,318)" style="filter: url(&quot;#drop-shadow-filter-1&quot;);">
      <rect x="12" y="0" width="12" height="9" rx="3" fill="#92400E"/>
      <path d="M6 9H30L34 62C34 68 24 72 18 72C12 72 2 68 2 62L6 9Z" fill="url(#gold_premium)"/>
      <path d="M18 9V70" stroke="#713F12" stroke-opacity="0.25" stroke-width="2"/>
    </g>
  </g>
  <path d="M 0.919 140.659 C -8.482 62.8 55.328 -7.095 141.327 0.578 L 388.075 0.578 L 0.743 387.007 L 0.919 140.659 Z" fill="url(#soft_glint)" style="" transform="matrix(1, 0, 0, 1, 2.842170943040401e-14, 0)"/>
</svg>
        </div>

        <button onclick="generateAllIcons()">Generate PWA Icons</button>
        
        <div class="preview">
            <h3>Generated Icons</h3>
            <div id="downloads-container" class="downloads"></div>
        </div>
    </div>

    <script>
        // Core conversion function
        function svgToBase64(svgElement) {
            const svgString = new XMLSerializer().serializeToString(svgElement);
            const base64 = btoa(unescape(encodeURIComponent(svgString)));
            return `data:image/svg+xml;base64,${base64}`;
        }

        // Convert SVG to PNG with specific size
        function svgToPNG(svgElement, width, height, callback) {
            const svgDataUrl = svgToBase64(svgElement);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            // Set canvas size
            canvas.width = width;
            canvas.height = height;
            
            img.onload = function() {
                // Clear and draw with white background
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                
                const pngDataUrl = canvas.toDataURL('image/png');
                callback(null, pngDataUrl);
            };
            
            img.onerror = function() {
                callback(new Error('Failed to convert SVG to PNG'));
            };
            
            img.src = svgDataUrl;
        }

        // Generate all icon sizes for PWA
        function generateAllIcons() {
            const svgElement = document.getElementById('source-svg');
            const downloadsContainer = document.getElementById('downloads-container');
            downloadsContainer.innerHTML = '<p>Generating icons...</p>';

            // Standard PWA icon sizes
            const iconSizes = [
                { size: 512, name: 'icon-512x512', purpose: 'PWA Splash/App Store' },
                { size: 192, name: 'icon-192x192', purpose: 'PWA Manifest' },
                { size: 180, name: 'apple-touch-icon', purpose: 'Apple Home Screen' },
                { size: 144, name: 'icon-144x144', purpose: 'Windows/IE' },
                { size: 96, name: 'icon-96x96', purpose: 'Android' },
                { size: 32, name: 'favicon-32x32', purpose: 'Favicon' }
            ];

            let completed = 0;
            
            iconSizes.forEach(icon => {
                svgToPNG(svgElement, icon.size, icon.size, (error, pngDataUrl) => {
                    if (error) {
                        console.error(`Error generating ${icon.name}:`, error);
                        return;
                    }
                    
                    createDownloadItem(icon.name, icon.size, icon.purpose, pngDataUrl);
                    completed++;
                    
                    // Update progress
                    if (completed === iconSizes.length) {
                        console.log('All icons generated successfully!');
                    }
                });
            });
        }

        // Create download link and preview for each icon
        function createDownloadItem(name, size, purpose, dataUrl) {
            const container = document.getElementById('downloads-container');
            
            // Remove loading message if it exists
            if (container.querySelector('p')) {
                container.innerHTML = '';
            }
            
            const item = document.createElement('div');
            item.className = 'download-item';
            
            // Create preview image
            const preview = document.createElement('img');
            preview.src = dataUrl;
            preview.alt = name;
            preview.className = 'icon-preview';
            preview.style.width = '64px';
            preview.style.height = '64px';
            
            // Create download link
            const downloadLink = document.createElement('a');
            downloadLink.href = dataUrl;
            downloadLink.download = `${name}.png`;
            downloadLink.innerHTML = `Download ${size}x${size}`;
            downloadLink.style.display = 'block';
            downloadLink.style.marginTop = '10px';
            
            // Size info
            const sizeInfo = document.createElement('div');
            sizeInfo.innerHTML = `<strong>${size}×${size}</strong><br><small>${purpose}</small>`;
            sizeInfo.style.marginBottom = '10px';
            sizeInfo.style.fontSize = '12px';
            
            item.appendChild(preview);
            item.appendChild(sizeInfo);
            item.appendChild(downloadLink);
            container.appendChild(item);
        }

        // Bonus: Generate manifest.json content
        function generateManifestContent() {
            return JSON.stringify({
                "name": "My PWA App",
                "short_name": "MyApp",
                "start_url": "/",
                "display": "standalone",
                "background_color": "#ffffff",
                "theme_color": "#000000",
                "icons": [
                    {
                        "src": "/icon-192x192.png",
                        "sizes": "192x192",
                        "type": "image/png"
                    },
                    {
                        "src": "/icon-512x512.png",
                        "sizes": "512x512", 
                        "type": "image/png"
                    }
                ]
            }, null, 2);
        }

        // Initialize - generate manifest example
        console.log('Copy this manifest.json content:');
        console.log(generateManifestContent());
    </script>
</body>
</html>
