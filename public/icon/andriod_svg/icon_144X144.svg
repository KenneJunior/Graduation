  <rect x="144.899" y="144.658" width="140.367" height="138.145" rx="122" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2" style="stroke-width: 2;" transform="matrix(0.8723037366367592, 0.01203140124199198, 0, 0.8802779380027914, 28.382728822319216, 25.270006261400326)"/>
