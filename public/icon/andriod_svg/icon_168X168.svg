<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="167.9418 167.1756 167.9999 170" width="168px" height="170px">
  <defs>
    <radialGradient id="studio_light" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft_drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-opacity="0.45"/>
    </filter>
    <radialGradient gradientUnits="userSpaceOnUse" cx="418" cy="278" r="0" id="gradient-0" gradientTransform="matrix(1, 0, 0, 1, 0, 0)">
      <stop offset="0" style="stop-color: rgb(0% 0% 0%)"/>
      <stop offset="1" style=""/>
    </radialGradient>
    <linearGradient gradientUnits="userSpaceOnUse" x1="418" y1="238" x2="418" y2="318" id="gradient-2" gradientTransform="matrix(1.000002, 0, 0, 1, -0.000932, 0)">
      <stop offset="0" style="stop-color: rgb(47.059% 20.784% 5.8824%)"/>
      <stop offset="1" style="stop-color: rgb(33.342% 9.9086% 0%)"/>
    </linearGradient>
    <linearGradient id="gold_premium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset="0.25" stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#EAB308"/>
      <stop offset="0.7" stop-color="#A16207"/>
      <stop offset="1" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="soft_glint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="white" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.04"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <style>
      .twinkle {
        animation: twinkle 2s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.1); }
      }
      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.03); filter: brightness(1.2); }
      }
      .small-twinkle {
        animation: small-twinkle 3s ease-in-out infinite alternate;
      }
      @keyframes small-twinkle {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .text-glow {
        animation: text-glow 2s ease-in-out infinite alternate;
      }
      @keyframes text-glow {
        0% { filter: drop-shadow(0 0 2px rgba(255,255,255,0.5)); }
        100% { filter: drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
      }
    </style>
  </defs>
  <rect style="fill-rule: nonzero; paint-order: stroke; stroke-width: 1;" fill="url(#studio_light)" x="191.891" y="192.594" width="192.593" height="190.518" rx="50" ry="50" transform="matrix(0.8723055045753014, 0.011898490824617802, 0, 0.880276154234423, 0.554269030812975, -4.643531529920438)"/>
  <rect width="192.593" height="190.518" rx="128" filter="url(#grain)" opacity="0.15" style="stroke-width: 1;" x="191.891" y="192.594" transform="matrix(0.8723055045753014, 0.011898490824617802, 0, 0.880276154234423, 0.554269030812975, -4.643531529920438)"/>
  <rect x="179.008" y="172.482" width="173.41" height="164.716" rx="122" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2" style="stroke-width: 2;" transform="matrix(0.8723055045753014, 0.011898490824617802, 0, 0.880276154234423, 20.158939525599067, 24.68444425959933)"/>
  <g filter="url(#soft_drop)" style="" transform="matrix(0.2839700325228023, 0.003872862794871424, 0, 0.32755616610032234, 181.9771371222032, 162.51810472175566)">
