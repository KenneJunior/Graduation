<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="191.8735 191.3099 192.5755 193.1388" width="192.575px" height="193.139px" xmlns:bx="https://boxy-svg.com">
  <defs>
    <radialGradient id="studio_light" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft_drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-opacity="0.45"/>
    </filter>
    <filter id="drop-shadow-filter-0" bx:preset="drop-shadow 1 10 10 3 0.5 rgba(0,0,0,0.3)" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="10" dy="10"/>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="1"/>
      </feComponentTransfer>
      <feFlood flood-color="rgba(0,0,0,0.3)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient gradientUnits="userSpaceOnUse" cx="418" cy="278" r="0" id="gradient-0" gradientTransform="matrix(1, 0, 0, 1, 0, 0)">
      <stop offset="0" style="stop-color: rgb(0% 0% 0%)"/>
      <stop offset="1" style=""/>
    </radialGradient>
    <linearGradient gradientUnits="userSpaceOnUse" x1="418" y1="238" x2="418" y2="318" id="gradient-2" gradientTransform="matrix(1.000002, 0, 0, 1, -0.000932, 0)">
      <stop offset="0" style="stop-color: rgb(47.059% 20.784% 5.8824%)"/>
      <stop offset="1" style="stop-color: rgb(33.342% 9.9086% 0%)"/>
    </linearGradient>
    <filter id="drop-shadow-filter-2" bx:preset="drop-shadow 1 26 10 0 0.52 rgba(0,0,0,0.3)" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0"/>
      <feOffset dx="26" dy="10"/>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="1.04"/>
      </feComponentTransfer>
      <feFlood flood-color="rgba(0,0,0,0.3)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inner-shadow-filter-0" bx:preset="inner-shadow 1 0 0 10 0.5 rgba(0,0,0,0.7)" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="10"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer result="choke">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
      <feFlood flood-color="rgba(0,0,0,0.7)" result="color"/>
      <feComposite operator="in" in="color" in2="choke" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <filter id="drop-shadow-filter-1" bx:preset="drop-shadow 1 16 9 1 0.5 rgba(0,0,0,0.3)" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="16" dy="9"/>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="1"/>
      </feComponentTransfer>
      <feFlood flood-color="rgba(0,0,0,0.3)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="gold_premium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset="0.25" stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#EAB308"/>
      <stop offset="0.7" stop-color="#A16207"/>
      <stop offset="1" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="soft_glint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="white" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.04"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <style>
      .twinkle {
        animation: twinkle 2s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.1); }
      }
      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); filter: brightness(1); }
        50% { transform: scale(1.03); filter: brightness(1.2); }
      }
      .small-twinkle {
        animation: small-twinkle 3s ease-in-out infinite alternate;
      }
      @keyframes small-twinkle {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .text-glow {
        animation: text-glow 2s ease-in-out infinite alternate;
      }
      @keyframes text-glow {
        0% { filter: drop-shadow(0 0 2px rgba(255,255,255,0.5)); }
        100% { filter: drop-shadow(0 0 8px rgba(255,255,255,0.8)); }
      }
    </style>
  </defs>
  <rect style="fill-rule: nonzero; paint-order: stroke; stroke-width: 1;" fill="url(#studio_light)" x="191.891" y="192.594" width="192.593" height="190.518" rx="50" ry="50" transform="matrix(0.9999089241027832, 0.013518000021576881, 0, 1.0000909566879272, 2.842170943040401e-14, -3.895576000213623)"/>
  <rect width="192.593" height="190.518" rx="128" filter="url(#grain)" opacity="0.15" style="stroke-width: 1;" x="191.891" y="192.594" transform="matrix(0.9999089241027832, 0.013518000021576881, 0, 1.0000909566879272, 2.842170943040401e-14, -3.895576000213623)"/>
  <rect x="177.911" y="176.681" width="172.347" height="168.726" rx="122" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2" style="stroke-width: 2;" transform="matrix(0.999908983707428, 0.013518000021576881, 0, 1.0000909566879272, 24.10079002380374, 23.241662979125977)"/>
  <g style="filter: url(&quot;#soft_drop&quot;) url(&quot;#drop-shadow-filter-0&quot;);" transform="matrix(0.32551005482673645, 0.004399999976158142, 0, 0.37213999032974243, 207.96192932128906, 186.0185089111328)">
    <path d="M150 275V340C150 340 198 390 256 390C314 390 362 340 362 340V275" fill="#020617"/>
    <path d="M460 228L256 330L52 228V240L256 340L460 240V228Z" fill="#020617"/>
    <path d="M256 120L460 228L256 330L52 228L256 120Z" fill="#0F172A"/>
    <path d="M256 120L460 228L256 260Z" fill="white" opacity="0.045"/>
    <ellipse cx="256" cy="228" rx="11" ry="5.5" fill="#020617"/>
    <path d="M256 228C256 228 370 232 418 238" stroke="#020617" stroke-width="3" fill="none"/>
    <path d="M 418.04 237.062 L 415.985 317.626" stroke-linecap="round" style="fill: url(&quot;#gradient-0&quot;); stroke: url(&quot;#gradient-2&quot;); stroke-width: 1.072; filter: url(&quot;#drop-shadow-filter-2&quot;);"/>
    <g transform="translate(398,318)" style="filter: url(&quot;#inner-shadow-filter-0&quot;) url(&quot;#drop-shadow-filter-1&quot;);">
      <rect x="12" y="0" width="12" height="9" rx="3" fill="#92400E"/>
      <path d="M6 9H30L34 62C34 68 24 72 18 72C12 72 2 68 2 62L6 9Z" fill="url(#gold_premium)"/>
      <path d="M18 9V70" stroke="#713F12" stroke-opacity="0.25" stroke-width="2"/>
    </g>
  </g>
  <path d="M 192.263 237.832 C 194.06 209.397 217.903 196.912 217.903 196.912 C 217.907 196.912 227.939 193.456 235.914 191.597 C 235.914 191.597 237.786 191.486 254.053 192.737 L 338.523 193.665 L 192.411 337.206 L 192.263 237.832 Z" fill="url(#soft_glint)" style="stroke-width: 1;" transform="matrix(1, 0, 0, 1, 2.842170943040401e-14, 0)"/>
</svg>
